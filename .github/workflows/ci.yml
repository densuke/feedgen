name: CI

# main への Pull Request と push で、書式・静的解析・テストと、配備スクリプトの検査を行う。
# Dependabot の PR は dependabot-automerge.yml 側でテストするため、ここでは除く。
# カバレッジは計器として表示するだけで、しきい値では失敗させない (docs/specs/release.md R-1)。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: ソースの取得
        uses: actions/checkout@v7

      - name: Rustツールチェインのセットアップ
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: ビルドキャッシュ
        uses: Swatinem/rust-cache@v2

      - name: 書式検査
        run: cargo fmt --all -- --check

      - name: 静的解析
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: テスト
        run: cargo test --workspace

      - name: cargo-llvm-cov の導入
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: カバレッジの表示 (計器。失敗しても全体は失敗にしない)
        continue-on-error: true
        run: |
          {
            echo "## カバレッジ (計器。しきい値なし)"
            echo '```'
            cargo llvm-cov --workspace --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-scripts:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: ソースの取得
        uses: actions/checkout@v7

      - name: シェルの静的解析
        run: shellcheck -x -P SCRIPTDIR deploy/*.sh deploy/tests/test_deploy.sh

      - name: 配備スクリプトのテスト
        run: bash deploy/tests/test_deploy.sh
