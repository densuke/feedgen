[project]
name = "feedgen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cachetools>=7.1.4",
    "click>=8.4.1",
    "fastapi>=0.138.0",
    "feedgenerator>=2.2.1",
    "google-api-python-client>=2.197.0",
    "google-generativeai>=0.8.6",
    "googlenewsdecoder>=0.1.7",
    "httpx>=0.28.1",
    "instagram>=1.3.4",
    "instaloader>=4.15.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "redis>=8.0.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
instagram = [
    "instaloader>=4.14.2",
]

[project.scripts]
feedgen = "feedgen.cli.main:cli"
feedgen-serve = "feedgen.cli.webapi:serve"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
