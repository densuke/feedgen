[package]
name = "feedgen-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "feedgen の Web API (axum)"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
feedgen-core = { path = "../feedgen-core" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower-http = { version = "0.7", default-features = false, features = ["cors"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
